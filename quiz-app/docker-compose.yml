services:
  redis:
    image: redis:7-alpine
    container_name: redis-quiz
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - quiz_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Quiz service with Redis backend
  quiz-redis:
    build: .
    container_name: quiz-redis
    ports:
      - "8080:8080"
    environment:
      - DB_TYPE=redis
      - REDIS_ADDR=redis:6379
      - SERVER_PORT=8080
    networks:
      - quiz_network
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - redis

volumes:
  redis_data:

networks:
  quiz_network:
    driver: bridge
