services:
  redis:
    image: redis:7-alpine
    container_name: redis-quiz
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - quiz_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  aerospike:
    image: aerospike/aerospike-server-enterprise:8.1
    container_name: aerospike-quiz
    environment:
      NAMESPACE: quiz
      REPLICATION_FACTOR: 1
      MEM_GB: 1
      DEFAULT_TTL: 0
      FEATURE_KEY_FILE: /etc/aerospike/features.conf
    ports:
      - "3000:3000"
    volumes:
      - aerospike_data:/opt/aerospike/data
      - ./aerospike.conf:/etc/aerospike/aerospike.conf
    restart: unless-stopped
    networks:
      - quiz_network
    healthcheck:
      test: ["CMD", "/usr/bin/asinfo", "-v", "status"]
      timeout: 20s
      retries: 10


  # Quiz service with Redis backend
  quiz-redis:
    build: .
    container_name: quiz-redis
    ports:
      - "8080:8080"
    environment:
      - DB_TYPE=redis
      - REDIS_ADDR=redis:6379
      - SERVER_PORT=8080
    networks:
      - quiz_network
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - redis

  # Quiz service with Aerospike backend  
  quiz-aerospike:
    build: .
    container_name: quiz-aerospike
    ports:
      - "8081:8080"
    environment:
      - DB_TYPE=aerospike
      - AEROSPIKE_HOSTS=aerospike
      - AEROSPIKE_PORT=3000
      - SERVER_PORT=8080
    networks:
      - quiz_network
    depends_on:
      aerospike:
        condition: service_healthy
    profiles:
      - aerospike

volumes:
  redis_data:
  aerospike_data:

networks:
  quiz_network:
    driver: bridge
